services:
  - type: web
    name: waveguard-ai
    runtime: node
    repo: https://github.com/DWIND-source/waveguard-ai
    branch: main
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://dwind-source.github.io
      - key: TRUST_PROXY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
